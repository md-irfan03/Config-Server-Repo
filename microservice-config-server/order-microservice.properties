# ORDER SERVICE - overrides / additions to application.properties
server.port=9091

# payment service base URL
payment.service.url=http://localhost:9092

# ---------- actuator (override: adds circuit breaker endpoints) ----------
management.endpoints.web.exposure.include=health,info,metrics,beans,mappings,circuitbreakers,circuitbreakerevents

# ---------- resilience4j ----------
resilience4j.circuitbreaker.instances.paymentService.register-health-indicator=true
resilience4j.circuitbreaker.instances.paymentService.sliding-window-size=10
resilience4j.circuitbreaker.instances.paymentService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.paymentService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.paymentService.permitted-number-of-calls-in-half-open-state=3

# ---------- logging (overrides) ----------
app.logging.file-name=order-service
logging.level.com.amazon.order.microservice=INFO
