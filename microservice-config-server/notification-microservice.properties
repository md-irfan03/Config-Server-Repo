# NOTIFICATION SERVICE - overrides / additions to application.properties
server.port=9093

# ---------- kafka consumer ----------
spring.kafka.consumer.group-id=payment-service
# earliest = read from beginning, latest = only new messages
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=paymentEvent:com.notification.kafka.model.PaymentEvent
spring.kafka.consumer.properties.spring.json.value.default.type=com.notification.kafka.model.PaymentEvent
# do not require type info in Kafka headers
spring.kafka.consumer.properties.spring.json.use.type.headers=false
# manual commit, on explicit acknowledge
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual_immediate

# producer config used for DLT publishing
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Observation for Kafka
spring.kafka.listener.observation-enabled=true

# ---------- logging (overrides) ----------
app.logging.file-name=notification-service
logging.level.com.notification=INFO
