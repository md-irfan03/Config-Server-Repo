# PAYMENT SERVICE - overrides / additions to application.properties
server.port=9094

# ---------- kafka producer ----------
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=paymentEvent:com.amazon.payment.kafka.model.PaymentEvent

# Acknowledgment level: 0 = none, 1 = leader, all = leader + all in-sync replicas
spring.kafka.producer.acks=all

# Retry (2s delay between attempts)
spring.kafka.producer.retries=3
spring.kafka.producer.properties.retry.backoff.ms=2000

# Idempotence (avoids duplicates during retries)
spring.kafka.producer.properties.enable.idempotence=true

# Max time for a record delivery attempt (10s)
spring.kafka.producer.properties[delivery.timeout.ms]=10000

# Max time for a broker request (3s)
spring.kafka.producer.properties.request.timeout.ms=3000

# Send immediately, no batching
spring.kafka.producer.properties.linger.ms=0

# Observation for Kafka
spring.kafka.template.observation-enabled=true

# ---------- logging (overrides) ----------
app.logging.file-name=payment-service
logging.level.com.amazon.payment=INFO
