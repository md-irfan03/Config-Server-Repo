# =====================================================================
# COMMON CONFIG - applies to ALL microservices
# Service files (order-/payment-/notification-microservice.properties)
# override anything defined here.
# NOTE: spring.application.name + spring.config.import stay LOCAL in each
# service (needed to find its own file in the central repo).
# =====================================================================

# ---------- database ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/microservice
spring.datasource.username=postgres
spring.datasource.password=irfan@123
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---------- eureka client ----------
# register-with-eureka / fetch-registry are true by default
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ---------- kafka (broker only; serializers etc. are service specific) ----------
spring.kafka.bootstrap-servers=localhost:9092

# ---------- tracing (zipkin) ----------
# send every trace during local learning
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans

# ---------- actuator ----------
management.endpoints.web.exposure.include=health,info,metrics,beans,mappings
management.endpoint.health.show-details=always

# ---------- logging (read by the common logback-spring.xml) ----------
logging.level.root=INFO

app.logging.dir=microservice-logs
# default log file name = application name; services may override (e.g. order-service)
app.logging.file-name=${spring.application.name}
app.logging.max-file-size=10MB
app.logging.max-history=30
app.logging.total-size-cap=1GB
app.logging.pattern=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [${spring.application.name},traceId=%X{traceId:-},spanId=%X{spanId:-}] %logger{36} - %msg%n
